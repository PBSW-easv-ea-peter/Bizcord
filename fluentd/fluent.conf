# Node-agent: Reads every container´s json-file log, and only keeps services labelled logging=fluentd.

<source>
  @type tail
  path /fluentd/log/containers/*/*.log
  pos_file /fluentd/pos/docker.pos
  tag docker.*
  read_from_head false
  refresh_interval 5s
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>

# Opt-in: only containers with the label reach the output - also prevents fluentd from re-reading its own stdout.
<filter docker.**>
  @type grep
  <regexp>
    key $.attrs.logging
    pattern /^fluentd$/
  </regexp>
</filter>

# Turn the Serilog JSON in Docker's "log" field into real fields; non-JSON lines are kept as raw text.
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

<match **>
  @type stdout
</match>
