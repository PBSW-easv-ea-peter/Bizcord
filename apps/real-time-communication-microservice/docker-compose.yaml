services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    user: "1000"  # Run as non-root (default RabbitMQ user)
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq  # Persist data
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  realtimecommunicationserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtimecommunicationserver
    ports:
      - "8080:5030"
    environment:
      RabbitMq__Host: rabbitmq
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5030 
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
