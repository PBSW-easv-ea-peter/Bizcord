services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatDB"]
      interval: 2s
      timeout: 3s
      retries: 15
