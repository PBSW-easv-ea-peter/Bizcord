# Full stack: RabbitMQ + Postgres (ChatDB, FileDB) + ChatService + RealTimeCommunicationServer + FileService.
# Run from the repo root: docker compose up --build
# Must not run at the same time as the compose files under apps/ (same ports).
volumes:
  vault-data:

services:
  vault:
    image: hashicorp/vault:1.21.0
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro,z
      - vault-data:/vault/file
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # As the rabbitmq user: run as root, the CLI creates .erlang.cookie before the server does,
      # so the file ends up owned by root and the server fails with eacces. su resets PATH, hence the full PATH.
      test: ["CMD-SHELL", "su rabbitmq -s /bin/sh -c 'PATH=/opt/rabbitmq/sbin:/opt/erlang/bin:/usr/bin:/bin rabbitmq-diagnostics -q check_port_connectivity'"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Username: guest
    # Password: guest

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./apps/chat-microservice/chatDB/postgres/init:/docker-entrypoint-initdb.d:Z,ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatDB"]
      interval: 2s
      timeout: 3s
      retries: 15

  api-gateway:
    build:
      context: ./apps/api-gateway/
      dockerfile: Dockerfile
    environment:
      Vault__Token: # ${VAULT_TOKEN}
      Vault__Address: http://vault:8200
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
 
  # FileService's own database (database per service) - a separate container, like it would be in production.
  filedb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fileDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - ./apps/file-microservice/fileDB/postgres/init:/docker-entrypoint-initdb.d:Z,ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fileDB"]
      interval: 2s
      timeout: 3s
      retries: 15

  fileservice:
    build:
      context: .
      dockerfile: apps/file-microservice/Dockerfile
    ports:
      - "8083:8083"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8083
      RabbitMq__Host: rabbitmq
      ConnectionStrings__FileDb: "Host=filedb;Port=5432;Database=fileDB;Username=admin;Password=admin"
    depends_on:
      rabbitmq:
        condition: service_healthy
      filedb:
        condition: service_healthy

  chatservice:
    build:
      context: .
      dockerfile: apps/chat-microservice/Dockerfile
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      RabbitMq__Host: rabbitmq
      ConnectionStrings__ChatDb: "Host=postgres;Port=5432;Database=chatDB;Username=admin;Password=admin"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      logging: "fluentd"
    logging:
      driver: json-file
      options:
        labels: logging

  realtimecommunicationserver:
    build:
      context: .
      dockerfile: apps/real-time-communication-microservice/Dockerfile
    ports:
      - "8082:8082"
    environment:
      ASPNETCORE_URLS: http://+:8082
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Host: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    labels:
      logging: "fluentd"
    logging:
      driver: json-file
      options:
        labels: logging

  fluentd:
    image: fluent/fluentd:v1.17-1
    user: root
    volumes:
       - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
       - /var/lib/docker/containers:/fluentd/log/containers:ro
       - fluentd-pos:/fluentd/pos

volumes:
  fluentd-pos:
