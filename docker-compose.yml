# Samlet stack: RabbitMQ + Postgres + ChatService + RealTimeCommunicationServer.
# Kør fra repo-roden: docker compose up --build
# Må ikke køre samtidig med compose-filerne under apps/ (samme porte).

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # Som rabbitmq-brugeren: kørt som root opretter CLI'en .erlang.cookie før serveren,
      # så filen bliver root-ejet, og serveren fejler med eacces. su nulstiller PATH, derfor fuld PATH.
      test: ["CMD-SHELL", "su rabbitmq -s /bin/sh -c 'PATH=/opt/rabbitmq/sbin:/opt/erlang/bin:/usr/bin:/bin rabbitmq-diagnostics -q check_port_connectivity'"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Username: user
    # Password: user

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./apps/chat-context/chatDB/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatDB"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Dummy-data - kun på forespørgsel: docker compose --profile seed up seed
  seed:
    image: postgres:17-alpine
    profiles: [seed]
    environment:
      PGPASSWORD: admin
    volumes:
      - ./apps/chat-context/chatDB/postgres/seed:/seed:ro
    # pg_isready kan melde klar, mens init-scripts stadig kører (kun via socket) - vent på TCP.
    command: >
      sh -c "until psql -h postgres -U admin -d chatDB -c 'select 1' >/dev/null 2>&1; do sleep 1; done
      && psql -h postgres -U admin -d chatDB -v ON_ERROR_STOP=1 -f /seed/seed.sql"
    depends_on:
      postgres:
        condition: service_healthy

  chatservice:
    build:
      context: .
      dockerfile: apps/chat-context/Dockerfile
    ports:
      - "8000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      ConnectionStrings__ChatDb: "Host=postgres;Port=5432;Database=chatDB;Username=admin;Password=admin"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  realtimecommunicationserver:
    build:
      context: .
      dockerfile: apps/real-time-communication-microservice/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
