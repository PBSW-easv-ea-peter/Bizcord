# Full stack: RabbitMQ + Postgres + ChatService + RealTimeCommunicationServer.
# Run from the repo root: docker compose up --build
# Must not run at the same time as the compose files under apps/ (same ports).

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # As the rabbitmq user: run as root, the CLI creates .erlang.cookie before the server does,
      # so the file ends up owned by root and the server fails with eacces. su resets PATH, hence the full PATH.
      test: ["CMD-SHELL", "su rabbitmq -s /bin/sh -c 'PATH=/opt/rabbitmq/sbin:/opt/erlang/bin:/usr/bin:/bin rabbitmq-diagnostics -q check_port_connectivity'"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Username: user
    # Password: user

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./apps/chat-context/chatDB/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatDB"]
      interval: 2s
      timeout: 3s
      retries: 15

  chatservice:
    build:
      context: .
      dockerfile: apps/chat-context/Dockerfile
    ports:
      - "8000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      ConnectionStrings__ChatDb: "Host=postgres;Port=5432;Database=chatDB;Username=admin;Password=admin"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  realtimecommunicationserver:
    build:
      context: .
      dockerfile: apps/real-time-communication-microservice/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
